services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slipstream}
      POSTGRES_USER: ${POSTGRES_USER:-slipstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slipstream}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - slipstream-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-slipstream} -d $${POSTGRES_DB:-slipstream}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slipstream-postgres:
